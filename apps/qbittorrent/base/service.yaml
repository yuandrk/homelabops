apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: apps
  labels:
    app: qbittorrent
spec:
  selector:
    app: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  # ClusterIP is enough now that qbit.home.yuandrk.net resolves to k3s-master's
  # Tailscale address and Traefik routes on the Host header. The NodePort existed
  # only because LAN-only names had no working DNS.
  type: ClusterIP
