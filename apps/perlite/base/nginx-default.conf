# Upstream web/config/perlite.conf with four deliberate changes, marked inline below.
# The deny rules are what keep raw .md/.json, .git and .obsidian out of reach — Perlite
# renders notes through index.php, nothing is ever served as a plain file.
#
# Rendered into a ConfigMap by configMapGenerator, so editing this file changes the
# generated name and rolls the pod. Do not turn it back into a hand-written ConfigMap:
# it is mounted with subPath, which kubelet never refreshes in a running container.
server {
    # 8080, not 80: the pod runs as uid 1000 and a non-root process cannot bind a
    # privileged port. Matches nginx-unprivileged's own default.
    listen 8080;
    server_name localhost;

    root /var/www/perlite;
    index index.php index.html index.htm;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # nginx-unprivileged already relocates these to /tmp, but spell them out so the
    # config does not silently depend on the base image's sed patches.
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;

    location / {
        try_files $uri $uri/ /index.php;
    }

    # PHP-FPM Configuration Nginx
    location ~ \.php$ {
        try_files $uri = 404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Upstream targets the compose service name "perlite"; here php-fpm is a
        # sibling container in the same pod, so it answers on loopback.
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }

    # Syncthing keeps deleted/overwritten notes in .stversions. Not upstream — added
    # because this vault is a live Syncthing folder. Spell the three directory names
    # out: a bare /\.st also matches Perlite's own /.styles/, which serves every
    # stylesheet the page loads.
    location ~ /\.st(folder|ignore|versions) {
        deny all;
    }

    location ~* ^/(.*)/.obsidian/appearance.json$ {
        allow all;
    }

    location ~* ^/(.*)/.obsidian/(.*)/(.*).css$ {
        allow all;
    }

    location ~* ^/(.*)/.obsidian/(.*)/(.*).map$ {
        allow all;
    }

    location ~ \.(git|github|obsidian|trash) {
        deny all;
    }

    location ~ \.(md|json)$ {
        deny all;
    }
}
