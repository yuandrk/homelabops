apiVersion: apps/v1
kind: Deployment
metadata:
  name: perlite
  namespace: apps
  labels:
    app: perlite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: perlite
  template:
    metadata:
      labels:
        app: perlite
    spec:
      # The Obsidian vault is a hostPath on k3s-master (/home/yuandrk/vault/my_own, kept in
      # sync by the user's Syncthing service), so the pod cannot move. Same reasoning as
      # qbittorrent.
      nodeSelector:
        kubernetes.io/hostname: k3s-master
      # /home/yuandrk is 0750 and the vault itself 0700, both owned by uid 1000 — group and
      # other have nothing, so only uid 1000 can read it. Running the whole pod as 1000 gives
      # it exactly the access that account already has, with no chmod on the host and no
      # widening of $HOME for anything else. fsGroup only affects the emptyDirs below;
      # kubelet never applies it to hostPath.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      # nginx serves Perlite's own assets (.styles, .js, vendor, svg) straight off disk while
      # php-fpm executes index.php from the same tree. docker-compose shares them with
      # `volumes_from`, which has no pod equivalent — so copy the image's app dir into an
      # emptyDir that both containers mount.
      - name: copy-app
        image: sec77/perlite:1.6.1
        command:
        - sh
        - -c
        - cp -a /var/www/perlite/. /app/
        volumeMounts:
        - name: app
          mountPath: /app
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
      containers:
      - name: perlite
        # php:fpm-alpine underneath — FastCGI only, no web server. Started as non-root, so
        # php-fpm logs that the pool's `user` directive is ignored and runs the workers as
        # uid 1000; that warning is expected.
        image: sec77/perlite:1.6.1
        ports:
        - containerPort: 9000
          name: fastcgi
        env:
        # Must be the mounted folder name, not a path: Perlite reads /var/www/perlite/$NOTES_PATH.
        - name: NOTES_PATH
          value: "Notes"
        - name: HOME_FILE
          value: "Home"
        # No HIDE_FOLDERS: the whole vault is published by choice. Dot-folders (.obsidian,
        # .git, .claude, .stversions) stay out of the listing via HIDDEN_FILE_ACCESS and are
        # denied outright by the nginx config.
        - name: HIDDEN_FILE_ACCESS
          value: "false"
        - name: HTML_SAFE_MODE
          value: "true"
        - name: LINE_BREAKS
          value: "true"
        - name: ABSOLUTE_PATHS
          value: "false"
        - name: NICE_LINKS
          value: "true"
        - name: SHOW_TOC
          value: "true"
        - name: SHOW_LOCAL_GRAPH
          value: "true"
        - name: DISABLE_POP_HOVER
          value: "false"
        - name: ZETTELKASTEN_FILENAMES_ENABLED
          value: "false"
        # The vault keeps images and PDFs under Attachments/.
        - name: ALLOWED_FILE_LINK_TYPES
          value: "pdf,mp4,png,jpg,jpeg,webp,gif,svg,mp3,m4a"
        - name: FONT_SIZE
          value: "15"
        - name: TEMP_PATH
          value: "/tmp"
        - name: SITE_TITLE
          value: "my_own"
        - name: SITE_NAME
          value: "Perlite"
        - name: SITE_TYPE
          value: "article"
        - name: SITE_LOGO
          value: "perlite.svg"
        volumeMounts:
        - name: app
          mountPath: /var/www/perlite
        - name: vault
          mountPath: /var/www/perlite/Notes
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 30
      - name: nginx
        # The unprivileged variant already moves the pid file and every *_temp_path under
        # /tmp and defaults to port 8080, so an arbitrary uid works without overriding the
        # main nginx.conf.
        image: nginxinc/nginx-unprivileged:1.31-alpine
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: app
          mountPath: /var/www/perlite
          readOnly: true
        # nginx serves attachments directly, so it needs the vault too.
        - name: vault
          mountPath: /var/www/perlite/Notes
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: nginx-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
      volumes:
      - name: app
        emptyDir: {}
      - name: vault
        hostPath:
          # type: Directory so the pod fails loudly if the vault ever disappears, rather
          # than silently serving an empty site.
          path: /home/yuandrk/vault/my_own
          type: Directory
      - name: tmp
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: perlite-nginx
