apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- service.yaml
- ingress.yaml

# Generated rather than hand-written so the ConfigMap name carries a content hash: the
# nginx config is mounted with subPath, and kubelet never refreshes a subPath mount in a
# running container. With a hash, editing the config renames the ConfigMap, which changes
# the Deployment's volume reference and rolls the pod on its own.
configMapGenerator:
- name: perlite-nginx
  # Without this the generated ConfigMap lands in the default namespace while the
  # Deployment is in `apps`, and kustomize then refuses to rewrite the volume's
  # configMap.name to the hashed one — the pod would mount a ConfigMap that never exists.
  namespace: apps
  files:
  - default.conf=nginx-default.conf

commonLabels:
  app: perlite
