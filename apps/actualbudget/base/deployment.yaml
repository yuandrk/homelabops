apiVersion: apps/v1
kind: Deployment
metadata:
  name: actualbudget
  namespace: apps
  labels:
    app: actualbudget
spec:
  replicas: 1
  # Recreate: /data is SQLite on a single host path, so two pods must never write it at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actualbudget
  template:
    metadata:
      labels:
        app: actualbudget
    spec:
      # Pinned to k3s-master: /data is a hostPath there (/srv/data/actualbudget), covered by the
      # nightly restic backup. Moved off k3s-worker1 after its USB-SSD hung in 2026-10.
      nodeSelector:
        kubernetes.io/hostname: k3s-master
      containers:
      - name: actualbudget
        image: actualbudget/actual-server:26.8.1
        ports:
        - containerPort: 5006
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        - name: ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB
          value: "100"
        volumeMounts:
        - name: actual-data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: actual-data
        hostPath:
          path: /srv/data/actualbudget
          type: Directory