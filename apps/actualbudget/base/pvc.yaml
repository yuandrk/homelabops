# Old data volume on k3s-worker1 (local-path). Unused since the move to /srv/data/actualbudget
# on k3s-master; kept bound as the rollback path until the cleanup commit removes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actualbudget-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi