apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: apps
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      version: "0.13.4"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: apps
  values:
    # Shared configuration for all components
    controllers:
      main:
        containers:
          main:
            envFrom:
              - secretRef:
                  name: immich-credentials

    # Library storage: static NFS volume on k3s-master (pv.yaml)
    immich:
      persistence:
        library:
          existingClaim: immich-library-v2

    # Valkey (Redis replacement)
    valkey:
      enabled: true
      controllers:
        main:
          pod:
            nodeSelector:
              kubernetes.io/hostname: k3s-worker3
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                # Full version on purpose: the short 9.2-alpine tag pointed at 9.2.0-rc1.
                tag: 9.1.2-alpine
      persistence:
        data:
          enabled: true
          type: emptyDir

    # Server component
    server:
      enabled: true
      controllers:
        main:
          pod:
            nodeSelector:
              kubernetes.io/hostname: k3s-worker3
            # Grant access to Intel iGPU for QSV hardware transcoding
            securityContext:
              supplementalGroups:
                - 44    # video group
                - 993   # render group (host GID for /dev/dri/renderD128)
          containers:
            main:
              # repository is the chart default; it is spelled out so Renovate can see the tag.
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.3.1
              envFrom:
                - secretRef:
                    name: immich-credentials
              env:
                - name: IMMICH_WORKERS_API
                  value: "4"
                - name: IMMICH_WORKERS_MICROSERVICES
                  value: "2"
                - name: REDIS_HOSTNAME
                  value: immich-valkey
                - name: IMMICH_MACHINE_LEARNING_URL
                  value: http://immich-machine-learning:3003
              # Enable privileged mode for GPU device access (Intel QSV)
              securityContext:
                privileged: true
              resources:
                requests:
                  cpu: 500m
                  memory: 4Gi
                limits:
                  memory: 8Gi
              probes:
                startup:
                  enabled: true
                  spec:
                    failureThreshold: 60
                    periodSeconds: 10
      # Mount Intel iGPU device for QSV transcoding
      persistence:
        dri:
          enabled: true
          type: hostPath
          hostPath: /dev/dri
          globalMounts:
            - path: /dev/dri

    # Machine learning component (CPU-only)
    machine-learning:
      enabled: true
      controllers:
        main:
          pod:
            nodeSelector:
              kubernetes.io/hostname: k3s-worker3
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.3.1
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  memory: 6Gi
      persistence:
        cache:
          enabled: true
          size: 10Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          storageClass: local-path
