# Library on k3s-master, pre-bound to the static PV in pv.yaml. storageClassName "" keeps
# the default local-path class from claiming it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-v2
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: immich-library-master
  resources:
    requests:
      storage: 500Gi
