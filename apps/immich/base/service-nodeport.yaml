# Direct LAN access to Immich on port 30283 of any node, for the mobile app at home (8f4e17e).
# The one deliberate NodePort: everything else is reached by hostname (see CLAUDE.md).
apiVersion: v1
kind: Service
metadata:
  name: immich-server-nodeport
  namespace: apps
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: server
  ports:
    - port: 2283
      targetPort: 2283
      nodePort: 30283
      protocol: TCP
