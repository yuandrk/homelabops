apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-internal-allowlist
  namespace: apps
  labels:
    app: jellyfin
spec:
  # Traefik v3 (k3s v1.33): defense-in-depth so Jellyfin only answers LAN + Tailscale clients.
  # Primary internet-isolation is that this host is NOT in the Cloudflare tunnel / has no public DNS.
  # Requires Traefik externalTrafficPolicy: Local (infrastructure/traefik) so the real
  # client IP survives k3s ServiceLB; otherwise every request is SNAT'd and rejected.
  ipAllowList:
    sourceRange:
      - 192.168.1.0/24    # home LAN (Wi-Fi)
      - 10.10.0.0/24      # wired cluster network
      - 100.64.0.0/10     # Tailscale CGNAT range
