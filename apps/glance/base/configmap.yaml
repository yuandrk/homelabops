apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: apps
  labels:
    app: glance
data:
  # Mounted at /app/config as a directory (not subPath), so edits here hot-reload without a
  # pod restart. Allow ~1-2 min for the kubelet's ConfigMap sync after a reconcile.
  #
  # ${TODOIST_TOKEN} is substituted at parse time from the env, which comes from the
  # glance-credentials Secret via envFrom. Never put the literal token in this file.
  glance.yml: |
    server:
      port: 8080
      # Behind Traefik, so trust X-Forwarded-For for rate limiting and logging.
      proxied: true

    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: Europe/London
                    label: London

              - type: calendar

          - size: full
            widgets:
              - type: monitor
                title: Services
                cache: 1m
                sites:
                  # `url` is the clickable link; `check-url` is what actually gets probed.
                  # Probing in-cluster Service DNS keeps the check off the ingress path and
                  # independent of external DNS.
                  - title: Immich
                    url: https://photos.yuandrk.net
                    check-url: http://immich-server.apps.svc.cluster.local:2283
                    icon: di:immich
                  - title: ActualBudget
                    url: https://budget.yuandrk.net
                    check-url: http://actualbudget.apps.svc.cluster.local:5006
                    icon: di:actual-budget
                  - title: n8n
                    url: https://n8n.yuandrk.net
                    check-url: http://n8n.apps.svc.cluster.local:5678/healthz
                    icon: di:n8n
                  - title: Grafana
                    url: https://grafana.yuandrk.net
                    check-url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health
                    icon: di:grafana
                  - title: Headlamp
                    url: https://headlamp.yuandrk.net
                    check-url: http://kube-system-headlamp.kube-system.svc.cluster.local
                    icon: di:kubernetes
                  - title: qBittorrent
                    url: http://qbit.yuandrk.net
                    check-url: http://qbittorrent.apps.svc.cluster.local:8080
                    icon: di:qbittorrent

              - type: custom-api
                title: Todoist — today & overdue
                cache: 10m
                url: https://api.todoist.com/api/v1/tasks/filter
                parameters:
                  query: today | overdue
                headers:
                  Authorization: Bearer ${TODOIST_TOKEN}
                template: |
                  {{ $tasks := sortByInt "priority" "desc" (.JSON.Array "results") }}
                  {{ if eq (len $tasks) 0 }}
                    <p class="color-positive">Nothing due today.</p>
                  {{ else }}
                  <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                    {{ range $tasks }}
                    <li>
                      <a class="size-h4 color-highlight block text-truncate" href="https://app.todoist.com/app/task/{{ .String "id" }}" target="_blank" rel="noreferrer">{{ .String "content" }}</a>
                      <ul class="list-horizontal-text">
                        {{ $p := .Int "priority" }}
                        {{/* Todoist's API numbers priority backwards: 4 is p1 (urgent), 1 is p4. */}}
                        <li{{ if ge $p 3 }} class="color-negative"{{ end }}>p{{ sub 5 $p }}</li>
                        <li>{{ .String "due.string" }}</li>
                      </ul>
                    </li>
                    {{ end }}
                  </ul>
                  {{ end }}

          - size: small
            widgets:
              - type: custom-api
                title: Nodes
                cache: 1m
                # Replaces a `server-stats` widget with `type: local`. In a pod, /proc is not
                # namespaced, so `local` would report whichever of the three nodes the scheduler
                # happened to pick, and disk would show the container's overlayfs rather than a
                # real partition. Prometheus already scrapes node_exporter on every node.
                #
                # The join against node_uname_info turns the `10.10.0.x:9100` instance label into
                # a real node name; sortByString then makes row order stable across refreshes.
                subrequests:
                  cpu:
                    url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: 100 - (avg by(nodename) (rate(node_cpu_seconds_total{mode="idle"}[5m]) * on(instance) group_left(nodename) node_uname_info) * 100)
                  memory:
                    url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: 100 * (1 - sum by(nodename)(node_memory_MemAvailable_bytes * on(instance) group_left(nodename) node_uname_info) / sum by(nodename)(node_memory_MemTotal_bytes * on(instance) group_left(nodename) node_uname_info))
                  disk:
                    url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: 100 * (1 - sum by(nodename)(node_filesystem_avail_bytes{mountpoint="/"} * on(instance) group_left(nodename) node_uname_info) / sum by(nodename)(node_filesystem_size_bytes{mountpoint="/"} * on(instance) group_left(nodename) node_uname_info))
                template: |
                  {{ $cpu := sortByString "metric.nodename" "asc" ((.Subrequest "cpu").JSON.Array "data.result") }}
                  {{ $mem := sortByString "metric.nodename" "asc" ((.Subrequest "memory").JSON.Array "data.result") }}
                  {{ $disk := sortByString "metric.nodename" "asc" ((.Subrequest "disk").JSON.Array "data.result") }}
                  {{ if eq (len $cpu) 0 }}
                    <p class="color-negative">No node metrics returned.</p>
                  {{ else }}
                  <div class="flex flex-column gap-10">
                    {{ range $i, $node := $cpu }}
                    <div>
                      <div class="size-h6 color-highlight">{{ $node.String "metric.nodename" }}</div>
                      <ul class="list-horizontal-text">
                        <li>cpu {{ printf "%.0f" ($node.Float "value.1") }}%</li>
                        <li>ram {{ printf "%.0f" ((index $mem $i).Float "value.1") }}%</li>
                        <li>disk {{ printf "%.0f" ((index $disk $i).Float "value.1") }}%</li>
                      </ul>
                    </div>
                    {{ end }}
                  </div>
                  {{ end }}

              - type: bookmarks
                groups:
                  - title: Homelab
                    links:
                      - title: Grafana
                        url: https://grafana.yuandrk.net
                      - title: Headlamp
                        url: https://headlamp.yuandrk.net
                      - title: homelabops
                        url: https://github.com/yuandrk/homelabops
