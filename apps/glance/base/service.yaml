apiVersion: v1
kind: Service
metadata:
  name: glance
  namespace: apps
  labels:
    app: glance
spec:
  # NodePort rather than ClusterIP: there is no local DNS for glance.yuandrk.net, and Traefik
  # routes by Host header, so hitting the ingress by IP would not match the rule. A host-less
  # catch-all Ingress would match — but the Cloudflare tunnel sends every unmatched hostname to
  # Traefik too, which would quietly publish this dashboard. NodePort keeps it to the node
  # interfaces: LAN and Tailscale only. Same approach as qbittorrent (30080).
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
    protocol: TCP
    name: http
  selector:
    app: glance
