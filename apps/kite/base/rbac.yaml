apiVersion: v1
kind: ServiceAccount
metadata:
  name: kite
  namespace: apps
  labels:
    app: kite
---
# Upstream default. Kite's own RBAC (configmap.yaml) decides what each user may do with it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kite-cluster-admin
  labels:
    app: kite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: kite
  namespace: apps
