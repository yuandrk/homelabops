# One item for both sandbox services rather than two: fewer 1Password API calls against the
# 1000/day plan quota (see the 2026-07-04 rate-limit incident) and one thing to rotate.
#
# The vault item is created by hand with the `op` CLI; this manifest only syncs an existing
# item. Required fields: searxng-secret-key, browserless-token.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: hermes-sandbox-credentials
  namespace: hermes-sandbox
spec:
  itemPath: "vaults/homelab/items/hermes-sandbox-credentials"
