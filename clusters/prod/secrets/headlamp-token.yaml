# Nothing in the cluster reads this Secret, on purpose: the item stores the break-glass token
# for Headlamp's headlamp-admin ServiceAccount (docs/access.md).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: headlamp-token
  namespace: kube-system
spec:
  itemPath: "vaults/homelab/items/headlamp-token"
