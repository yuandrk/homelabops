apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=45.5.5"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: [ "/metadata/annotations/prometheus-operator-validated" ]
        target:
          kind: PrometheusRule
  values:
    # Prometheus keeps only the metrics something reads: the dashboards, Kite's charts and the
    # alerts. Every source has an allowlist, here or in its PodMonitor, and a new metric goes
    # into it first (docs/monitoring.md#only-listed-metrics-are-kept).
    defaultRules:
      create: false
    # Alerts leave as pushes through ntfy.sh and as emails from healthchecks.io
    # (docs/monitoring.md#alerts). Each area is one check on healthchecks.io, whose keyword filter
    # reads the "status" of the short body below as down or up. The URLs come from the healthchecks
    # and ntfy Secrets, mounted under /etc/alertmanager/secrets/.
    alertmanager:
      enabled: true
      serviceMonitor:
        selfMonitor: false
      alertmanagerSpec:
        secrets: [healthchecks, ntfy]
        nodeSelector:
          kubernetes.io/arch: amd64
      config:
        inhibit_rules: []
        route:
          receiver: "null"
          group_by: [area]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 24h
          routes:
            - receiver: watchdog
              matchers: ['alertname = "Watchdog"']
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 2m
            # Every area alert goes to the phone too, then on to its email below
            - receiver: ntfy
              matchers: ['area =~ "nodes|cluster|tunnel"']
              continue: true
            - receiver: alerts-nodes
              matchers: ['area = "nodes"']
            - receiver: alerts-cluster
              matchers: ['area = "cluster"']
            - receiver: alerts-tunnel
              matchers: ['area = "tunnel"']
        receivers:
          - name: "null"
          - name: watchdog
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/healthchecks/watchdog
                send_resolved: false
          # The URL ends in ?tpl=alertmanager: ntfy's built-in template turns Alertmanager's own
          # body into the push's title and text. Alertmanager renders the URL as a template too,
          # and the one in the Secret appends &p=4 while the group is firing: high priority, which
          # iOS delivers as time-sensitive, through Focus. A resolved push keeps the default.
          - name: ntfy
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/ntfy/url
                send_resolved: true
          # healthchecks.io puts the body in its email, so it is cut down to the alerts' summaries
          - name: alerts-nodes
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/healthchecks/alerts-nodes
                send_resolved: true
                payload:
                  status: '{{ .Status }}'
                  alerts: '{{ range .Alerts.Firing }}{{ .Annotations.summary }} ({{ .Labels.alertname }}). {{ end }}{{ range .Alerts.Resolved }}Resolved: {{ .Annotations.summary }} ({{ .Labels.alertname }}). {{ end }}'
          - name: alerts-cluster
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/healthchecks/alerts-cluster
                send_resolved: true
                payload:
                  status: '{{ .Status }}'
                  alerts: '{{ range .Alerts.Firing }}{{ .Annotations.summary }} ({{ .Labels.alertname }}). {{ end }}{{ range .Alerts.Resolved }}Resolved: {{ .Annotations.summary }} ({{ .Labels.alertname }}). {{ end }}'
          - name: alerts-tunnel
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/healthchecks/alerts-tunnel
                send_resolved: true
                payload:
                  status: '{{ .Status }}'
                  alerts: '{{ range .Alerts.Firing }}{{ .Annotations.summary }} ({{ .Labels.alertname }}). {{ end }}{{ range .Alerts.Resolved }}Resolved: {{ .Annotations.summary }} ({{ .Labels.alertname }}). {{ end }}'
    # k3s runs the control plane in one process. The API server's metrics came back from both the
    # apiserver and the kubelet endpoint, and scheduler, controller-manager, proxy and etcd (k3s
    # uses SQLite) have no endpoint to scrape, so those targets only ever fired "down" alerts.
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    coreDns:
      enabled: false
    kubelet:
      serviceMonitor:
        kubelet: false
        probes: false
        # What Kite charts per pod and per node. cAdvisor stays at the chart's 10s interval because
        # Kite's queries use rate(...[1m]).
        cAdvisorMetricRelabelings:
          - sourceLabels: [__name__]
            action: keep
            regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total)'
          # Two of the chart's defaults, which this list replaces
          - sourceLabels: [__name__, interface]
            action: drop
            regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
          - sourceLabels: [id, pod]
            action: drop
            regex: '.+;'
    kube-state-metrics:
      collectors: [daemonsets, deployments, nodes, pods, statefulsets]
      metricAllowlist:
        - kube_node_status_allocatable
        - kube_node_status_condition
        - kube_pod_info
        - kube_pod_status_phase
        - kube_pod_container_status_restarts_total
        - kube_pod_container_status_waiting_reason
        - kube_pod_container_status_last_terminated_reason
        - kube_pod_container_resource_requests
        - kube_pod_container_resource_limits
        - kube_deployment_spec_replicas
        - kube_deployment_status_replicas_available
        - kube_statefulset_replicas
        - kube_statefulset_status_replicas_ready
        - kube_daemonset_status_desired_number_scheduled
        - kube_daemonset_status_number_ready
    prometheus-node-exporter:
      prometheus:
        monitor:
          metricRelabelings:
            - sourceLabels: [__name__]
              action: keep
              regex: 'node_(boot_time_seconds|uname_info|cpu_seconds_total|load(1|5|15)|memory_Mem(Available|Total)_bytes|filesystem_(avail_bytes|size_bytes|readonly)|disk_(read_bytes_total|written_bytes_total|io_time_seconds_total|io_now)|pressure_.+|hwmon_temp_celsius|thermal_zone_temp|power_supply_(online|capacity)|network_(receive|transmit)_bytes_total)'
            # Physical interfaces only: no veth per pod, CNI bridge or loopback
            - sourceLabels: [__name__, device]
              action: drop
              regex: 'node_network_.+;(veth|cni|flannel|lo).*'
    prometheus:
      serviceMonitor:
        selfMonitor: false
      prometheusSpec:
        # A year of history for App Usage. The size cap guards k3s-worker3's disk, because
        # local-path does not enforce the volume size.
        retention: 365d
        retentionSize: 9GiB
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        resources:
          requests:
            cpu: 200m
            memory: 200Mi
        podMonitorNamespaceSelector: {}
        podMonitorSelector:
          matchLabels:
            app.kubernetes.io/component: monitoring
        additionalScrapeConfigs:
          - job_name: traefik
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - kube-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                regex: traefik
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                regex: metrics
                action: keep
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
            # What the App Usage dashboard reads
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'traefik_service_(requests_total|responses_bytes_total)'
                action: keep
        # Schedule on amd64 nodes with more RAM (k3s-master or k3s-worker3)
        nodeSelector:
          kubernetes.io/arch: amd64
    prometheusOperator:
      serviceMonitor:
        selfMonitor: false
      # Schedule operator on amd64 nodes
      nodeSelector:
        kubernetes.io/arch: amd64
    grafana:
      defaultDashboardsEnabled: false
      serviceMonitor:
        enabled: false
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      envFromSecret: postgres-credentials
      # Schedule on amd64 nodes with more RAM (k3s-master or k3s-worker3)
      nodeSelector:
        kubernetes.io/arch: amd64
      # Increase startup delay to ensure sidecar writes datasources before Grafana reads them
      readinessProbe:
        httpGet:
          path: /api/health
          port: 3000
        initialDelaySeconds: 30
      livenessProbe:
        httpGet:
          path: /api/health
          port: 3000
        initialDelaySeconds: 60
        failureThreshold: 10
      sidecar:
        datasources:
          enabled: true
          label: grafana_datasource
          reloadURL: "http://localhost:3000/api/admin/provisioning/datasources/reload"
