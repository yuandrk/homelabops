apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - source-controller
          - kustomize-controller
          - notification-controller
  podMetricsEndpoints:
    - port: http-prom
      # Only what the Flux Cluster Stats dashboard reads here. The state of Flux objects
      # (gotk_resource_info) comes from flux-kube-state-metrics.
      metricRelabelings:
        - sourceLabels: [__name__]
          action: keep
          regex: 'gotk_reconcile_duration_seconds_(sum|count)'
