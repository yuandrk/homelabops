# Preserve the real client source IP into Traefik.
#
# k3s bundles Traefik as a managed HelmChart; this HelmChartConfig patches its values.
# By default the Traefik LoadBalancer Service uses externalTrafficPolicy: Cluster, so the
# k3s ServiceLB (klipper) SNATs the client address and Traefik only ever sees an internal
# IP — which breaks any source-IP-based middleware (e.g. the media apps' ipAllowList).
#
# externalTrafficPolicy: Local makes klipper stop masquerading and forward only to the node
# running Traefik, so the real LAN / Tailscale client IP reaches Traefik. Cluster-internal
# traffic (e.g. cloudflared → traefik ClusterIP) is unaffected; only direct LB access changes.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
