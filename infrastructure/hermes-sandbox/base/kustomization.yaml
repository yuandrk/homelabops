apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every file below also sets its own namespace, but declaring it here is what stops a future
# file that forgets to from landing silently in `default`.
namespace: hermes-sandbox

resources:
- namespace.yaml
- resource-quota.yaml
- rbac.yaml
- network-policy.yaml
- searxng.yaml
- browserless.yaml

configMapGenerator:
# Hash-suffixed so that editing searxng-settings.yml changes the ConfigMap name, which changes
# the pod template, which rolls the Deployment. SearXNG only reads settings.yml at boot.
- name: searxng-settings
  files:
  - settings.yml=searxng-settings.yml
